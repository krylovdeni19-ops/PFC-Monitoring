<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Остатки ПФЦ</title>
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" defer></script>
<script src="app.js" defer></script>
<main>
  <h1>Остатки ПФЦ</h1>
  <section>
    <h2>Подключение Google Таблицы</h2>
    <form id="settings">
      <label>Идентификатор клиента Google OAuth <input id="client" required></label>
      <label>Ссылка на Google Таблицу <input id="sheet" type="url" required></label>
      <button>Подключить Google</button>
    </form>
  </section>
  <section>
    <h2>Результат из «Мой ПФЦ»</h2>
    <p id="summary">Откройте результат поиска через расширение Chrome.</p>
    <div id="preview"></div>
    <button id="save" disabled>Записать в таблицу</button>
    <button id="history" disabled>Показать последние записи</button>
    <p id="status" role="status"></p>
    <div id="records"></div>
  </section>
</main>
</html>
