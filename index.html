<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Остатки ПФЦ</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
<main>
  <h1>Текущие остатки ПФЦ</h1>
  <form id="connect">
    <label for="reader">Ссылка на приложение чтения</label>
    <input id="reader" type="url" required>
    <button>Подключить Google</button>
  </form>
  <p id="status" role="status">Подключитесь рабочим Google-аккаунтом.</p>
  <details>
    <summary>Вставить остатки</summary>
    <form id="import-stock">
      <label for="stock-data">Данные из закрытой страницы Apps Script</label>
      <textarea id="stock-data" rows="5" required autocomplete="off" spellcheck="false"></textarea>
      <button>Показать остатки</button>
    </form>
  </details>
  <section id="stock" hidden>
    <label for="search">Баркод, название или МХ</label>
    <input id="search" type="search">
    <p id="count" role="status"></p>
    <div class="table"><table><thead><tr><th>МХ</th><th>Результат</th><th>Баркод</th><th>Название</th><th>Количество</th><th>Артикул WB</th><th>Бренд</th><th>Проверено МСК</th></tr></thead><tbody></tbody></table></div>
  </section>
</main>
</html>
